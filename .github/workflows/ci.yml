name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install analysis extras
        run: python -m pip install -e ".[analysis]"
      - name: Scientific invariant tests
        run: PYTHONPATH=src pytest tests -q
      - name: Pipeline help
        run: bash run_pipeline.sh --help
