name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install analysis extras
        run: python -m pip install -e ".[analysis]"
      - name: Scientific invariant tests
        run: PYTHONPATH=src pytest tests -q
      - name: Analysis module imports
        run: |
          PYTHONPATH=src python -c "from analysis.plots.style import apply_style"
          PYTHONPATH=src python src/analysis/run_pipeline.py --help
      - name: Pipeline help
        run: bash run_pipeline.sh --help
      - name: Analysis smoke (1 target, tiny bootstrap)
        env:
          PYTHON: python
          PYTHONPATH: src
          TARGETS: 1g5m
          N_BOOTSTRAP: "10"
          N_PERMUTATION: "10"
          FIGURE_DPI: "72"
          ANALYSIS_ROOT: ${{ github.workspace }}/ci_analysis_out
          MERGED_DATA_DIR: ${{ github.workspace }}/example/04_merged
          POSEBUSTERS_DIR: ${{ github.workspace }}/example/05_posebusters/tables
          POSEBUSTERS_BOLTZ2_DIR: ${{ github.workspace }}/example/05_posebusters/tables
          RUN_FIGURES: "0"
          RUN_POSEBUSTERS: "0"
        run: bash pipeline/postprocess/run_article_analysis.sh
